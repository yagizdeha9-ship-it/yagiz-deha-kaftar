<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YDK FILM</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:linear-gradient(90deg,#000,#171717);
  padding:22px 5%;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #222;
}

.logo{
  color:#e50914;
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.search{
  width:280px;
  padding:12px 16px;
  border-radius:25px;
  border:1px solid #444;
  background:#111;
  color:white;
  outline:none;
}

.hero{
  padding:70px 6%;
  min-height:360px;
  display:flex;
  align-items:center;
  background:
    linear-gradient(90deg,#050505 20%,rgba(5,5,5,.7),rgba(5,5,5,.2)),
    radial-gradient(circle at right,#451010,#090909 55%);
}

.hero h1{
  font-size:55px;
  margin-bottom:15px;
}

.hero p{
  max-width:650px;
  color:#bbb;
  font-size:18px;
  line-height:1.6;
}

.container{
  padding:35px 5%;
}

h2{
  margin-bottom:20px;
  font-size:26px;
}

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:35px;
}

.categories button{
  background:#202020;
  border:none;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
}

.categories button:hover,
.categories button.active{
  background:#e50914;
}

.continue-section{
  display:none;
  margin-bottom:45px;
}

.continue-card{
  max-width:380px;
}

.continue-card .card{
  margin:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:22px;
}

.card{
  background:#151515;
  border-radius:10px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}

.poster{
  height:280px;
  background:linear-gradient(135deg,#222,#555);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-size:20px;
  font-weight:bold;
}

.info{
  padding:15px;
}

.info h3{
  font-size:17px;
  margin-bottom:7px;
}

.info p{
  color:#999;
  font-size:13px;
  margin-bottom:12px;
}

.watch{
  width:100%;
  padding:10px;
  background:#e50914;
  border:0;
  border-radius:5px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.watch:hover{
  background:#f6121d;
}

.progress-wrap{
  height:5px;
  background:#333;
  margin-top:12px;
  border-radius:5px;
  overflow:hidden;
}

.progress{
  height:100%;
  background:#e50914;
  width:0%;
}

footer{
  text-align:center;
  color:#666;
  padding:45px 20px;
  margin-top:50px;
  border-top:1px solid #222;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:min(1000px,95vw);
  background:#111;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 20px 60px #000;
}

.modal-head{
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.close{
  background:#333;
  border:0;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

video{
  width:100%;
  max-height:70vh;
  display:block;
  background:#000;
}

@media(max-width:700px){
  .header-row{
    flex-direction:column;
    align-items:flex-start;
  }

  .search{
    width:100%;
  }

  .hero h1{
    font-size:38px;
  }

  .hero{
    padding:50px 6%;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .poster{
    height:220px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div class="logo">YDK FILM</div>
    <input
      class="search"
      id="search"
      type="text"
      placeholder="Film ara..."
      oninput="searchFilms()"
    >
  </div>
</header>

<section class="hero">
  <div>
    <h1>YAĞIZ DEHA KAFTAR</h1>
    <p>
      Ücretsiz ve yasal olarak izlenebilen klasik ve açık lisanslı
      filmlerden oluşan YDK FILM arşivi.
    </p>
  </div>
</section>

<div class="container">

  <!-- İZLEMEYE DEVAM ET -->
  <section class="continue-section" id="continueSection">
    <h2>▶ İzlemeye Devam Et</h2>
    <div class="continue-card" id="continueCard"></div>
  </section>

  <h2>Film Kataloğu — 30 Film</h2>

  <div class="categories">
    <button class="active" onclick="filterFilms('all',this)">Tümü</button>
    <button onclick="filterFilms('comedy',this)">😂 Komedi</button>
    <button onclick="filterFilms('chaplin',this)">🎩 Chaplin</button>
    <button onclick="filterFilms('animation',this)">🎨 Animasyon</button>
    <button onclick="filterFilms('classic',this)">🎞️ Klasik</button>
  </div>

  <div class="grid" id="filmGrid"></div>

</div>

<footer>
  © 2026 YDK FILM — YAĞIZ DEHA KAFTAR
</footer>

<!-- VIDEO MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">

    <div class="modal-head">
      <h2 id="modalTitle">Film</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <video
      id="player"
      controls
      playsinline
      preload="metadata"
    ></video>

  </div>
</div>

let currentFilter = "all";
let currentFilm = null;

const grid = document.getElementById("filmGrid");
const search = document.getElementById("search");
const modal = document.getElementById("modal");
const player = document.getElementById("player");
const modalTitle = document.getElementById("modalTitle");


/* -------------------------
   FİLMLERİ GÖSTER
------------------------- */

function renderFilms(list){

  grid.innerHTML = "";

  list.forEach(film => {

    const saved = getProgress(film.id);

    const card = document.createElement("div");
    card.className = "card";

    let progressHTML = "";

    if(saved > 0){
      progressHTML = `
        <div class="progress-wrap">
          <div class="progress" style="width:${saved.percent || 0}%"></div>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="poster">
        ${film.title}
      </div>

      <div class="info">

        <h3>${film.title}</h3>

        <p>${film.year} • ${getCategoryName(film.category)}</p>

        <button class="watch" onclick="openFilm(${film.id})">
          ▶ İzle
        </button>

        ${progressHTML}

      </div>
    `;

    grid.appendChild(card);

  });

}


/* -------------------------
   KATEGORİ
------------------------- */

function getCategoryName(category){

  if(category.includes("animation")) return "Animasyon";
  if(category.includes("chaplin")) return "Charlie Chaplin";
  if(category.includes("comedy")) return "Komedi";

  return "Klasik";
}


function filterFilms(category, button){

  currentFilter = category;

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  updateFilms();

}


/* -------------------------
   ARAMA
------------------------- */

function searchFilms(){
  updateFilms();
}


function updateFilms(){

  const text = search.value.toLowerCase().trim();

  let result = films.filter(film => {

    const matchesCategory =
      currentFilter === "all" ||
      film.category.includes(currentFilter);

    const matchesSearch =
      film.title.toLowerCase().includes(text);

    return matchesCategory && matchesSearch;

  });

  renderFilms(result);

}


/* -------------------------
   VIDEOYU AÇ
------------------------- */

function openFilm(id){

  const film = films.find(f => f.id === id);

  if(!film) return;

  currentFilm = film;

  modalTitle.textContent = film.title;

  player.src = film.url;

  modal.style.display = "flex";

  const saved = getProgress(id);

  player.onloadedmetadata = function(){

    if(saved && saved.time > 0){

      try{
        player.currentTime = saved.time;
      }catch(e){}

    }

    player.play().catch(()=>{});

  };

}


/* -------------------------
   VİDEO İLERLEMESİNİ KAYDET
------------------------- */

player.addEventListener("timeupdate", function(){

  if(!currentFilm) return;

  if(!player.duration || !isFinite(player.duration)) return;

  const time = player.currentTime;

  const percent =
    Math.min(100,(time / player.duration) * 100);

  localStorage.setItem(
    "ydk_progress_" + currentFilm.id,
    JSON.stringify({
      time:time,
      percent:percent,
      title:currentFilm.title
    })
  );

  showContinue();

});


/* -------------------------
   VİDEO BİTİNCE KAYDI SİL
------------------------- */

player.addEventListener("ended", function(){

  if(!currentFilm) return;

  localStorage.removeItem(
    "ydk_progress_" + currentFilm.id
  );

  currentFilm = null;

  showContinue();

  renderFilms(
    films.filter(f =>
      currentFilter === "all" ||
      f.category.includes(currentFilter)
    )
  );

});


/* -------------------------
   MODALI KAPAT
------------------------- */

function closeModal(){

  player.pause();

  player.removeAttribute("src");

  player.load();

  modal.style.display = "none";

  currentFilm = null;

  showContinue();

  updateFilms();

}


/* MODAL DIŞINA TIKLAMA */

modal.addEventListener("click",function(e){

  if(e.target === modal){
    closeModal();
  }

});


/* ESC */

document.addEventListener("keydown",function(e){

  if(e.key === "Escape"){
    closeModal();
  }

});


/* -------------------------
   KAYITLI İLERLEMEYİ AL
------------------------- */

function getProgress(id){

  try{

    const data =
      localStorage.getItem("ydk_progress_" + id);

    if(!data) return null;

    return JSON.parse(data);

  }catch(e){

    return null;

  }

}


/* -------------------------
   İZLEMEYE DEVAM ET
------------------------- */

function showContinue(){

  const section =
    document.getElementById("continueSection");

  const card =
    document.getElementById("continueCard");

  let savedFilm = null;
  let savedData = null;

  /*
    En son izlenen filmi bul.
  */

  for(let i = films.length - 1; i >= 0; i--){

    const data = getProgress(films[i].id);

    if(data && data.time > 5){

      savedFilm = films[i];
      savedData = data;
      break;

    }

  }

  if(!savedFilm){

    section.style.display = "none";
    card.innerHTML = "";
    return;

  }

  section.style.display = "block";

  const percent =
    Math.round(savedData.percent || 0);

  card.innerHTML = `

    <div class="card">

      <div class="poster">
        ${savedFilm.title}
      </div>

      <div class="info">

        <h3>${savedFilm.title}</h3>

        <p>
          ${savedFilm.year} •
          %${percent} izlendi
        </p>

        <button
          class="watch"
          onclick="openFilm(${savedFilm.id})">
          ▶ Kaldığın Yerden Devam Et
        </button>

        <div class="progress-wrap">

          <div
            class="progress"
            style="width:${percent}%">
          </div>

        </div>

      </div>

    </div>

  `;

}


/* -------------------------
   SAYFA AÇILINCA
------------------------- */

renderFilms(films);

showContinue();

</script>
